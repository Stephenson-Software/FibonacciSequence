name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Report the compiler
        run: |
          if ! command -v g++ > /dev/null; then
            echo "::error::no C++ compiler on the runner; this workflow cannot verify anything"
            exit 1
          fi
          g++ --version

      # The command below is the one documented in README.md. The two must stay in step.
      # It must never write to `fibonacci`, which is a tracked file.
      - name: Build
        run: g++ -std=c++17 -Wall -Wextra -o fibonacci-build fibonacci.cc

      # Compiles the program again (to fibonacci-check) and asserts what it prints for each
      # boundary input. Expectations live in check.sh; see README.md for how to run it locally.
      - name: Run the check script
        run: sh check.sh

      # Neither build may write to `fibonacci`, which is a tracked file.
      - name: Confirm the builds did not modify a tracked file
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the build left the working tree dirty"
            git status --porcelain
            exit 1
          fi
